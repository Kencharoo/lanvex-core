# Lanvex Core's checks. NetBox's own workflows are not part of this repository (FORK.md).
name: Lanvex Core

on:
  push:
    branches: [lanvex]
    tags: ["lanvex-core-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      netbox-suite:
        description: Also run NetBox's complete test suite (about 15 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, fork check, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      # NetBox's test configuration expects these credentials on localhost.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fork check compares with the NetBox release tag in lanvex/UPSTREAM

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_testing.txt

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends libpq-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_testing.txt ruff

      - name: No database migrations of our own
        working-directory: netbox
        env:
          NETBOX_CONFIGURATION: lanvex_configuration_testing
        run: python manage.py makemigrations --check --dry-run

      - name: Static files
        working-directory: netbox
        env:
          NETBOX_CONFIGURATION: netbox.configuration_testing
        run: python manage.py collectstatic --no-input -v 0

      - name: Lint, fork check, Lanvex Core tests${{ (startsWith(github.ref, 'refs/tags/') || inputs.netbox-suite) && ', NetBox suite' || '' }}
        run: lanvex/scripts/test.sh ${{ (startsWith(github.ref, 'refs/tags/') || inputs.netbox-suite) && '--full' || '' }}

  image:
    name: Image builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f lanvex/Dockerfile -t lanvex-core:ci .

      - name: Start both roles and check them
        run: lanvex/scripts/smoke-image.sh lanvex-core:ci
